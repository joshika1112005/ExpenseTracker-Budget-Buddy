name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run test script (placeholder)
        run: |
          echo "No tests defined yet"
          # npm test

      - name: Deployment step (optional placeholder)
        if: github.ref == 'refs/heads/main'
        run: echo "Deploy logic goes here"
